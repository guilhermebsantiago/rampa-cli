<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New arrivals | Corner Store</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 32px; color: #1f2328; }
      header { display: flex; align-items: center; gap: 12px; font-size: 20px; }
      .grid { display: grid; grid-template-columns: repeat(4, 180px); gap: 20px; }
      figure { margin: 0; }
      .grid img { width: 180px; height: 180px; border-radius: 12px; }
      figcaption { margin-top: 8px; font-weight: 600; }
      blockquote { border-left: 4px solid #d0d7de; margin: 16px 0; padding: 4px 16px; color: #57606a; }
      form { display: flex; gap: 8px; align-items: center; }
    </style>
  </head>
  <body>
    <header><img src="logo.svg" width="48" height="48" alt="Corner Store" /><strong>Corner Store</strong></header>
    <main>
      <h1>New arrivals</h1>
      <div class="grid">
        <figure><img src="mug.svg" alt="Blue ceramic mug" /><figcaption>Blue ceramic mug — $14</figcaption></figure>
        <figure><img src="umbrella.svg" alt="Red rain umbrella" /><figcaption>Rain umbrella — $22</figcaption></figure>
        <figure><img src="plant.svg" alt="Potted plant with green leaves" /><figcaption>Potted plant — $18</figcaption></figure>
        <figure>
          <img src="../non-text-content/dog.svg" alt="Toto, our store mascot: a smiling cartoon dog with a red collar" />
          <figcaption>Meet Toto</figcaption>
        </figure>
      </div>
      <p>Free shipping on orders over $50.</p>
      <p><a href="shipping.html">Shipping and returns</a></p>
      <h2>What customers say</h2>
      <blockquote lang="nl"><p>Prachtige mok, de koffie blijft lang warm. Ik koop er zeker nog een!</p></blockquote>
      <blockquote lang="pt-BR"><p>Entrega rápida e o guarda-chuva é muito resistente. Recomendo!</p></blockquote>
      <h2>Newsletter</h2>
      <form>
        <label for="email">Email address</label>
        <input id="email" type="email" name="email" autocomplete="email" />
        <button type="submit">Subscribe</button>
      </form>
    </main>
  </body>
</html>
