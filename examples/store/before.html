<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Corner Store — new arrivals (before)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 32px; color: #1f2328; }
      header { display: flex; align-items: center; gap: 12px; font-size: 20px; }
      .grid { display: grid; grid-template-columns: repeat(4, 180px); gap: 20px; }
      figure { margin: 0; }
      .grid img { width: 180px; height: 180px; border-radius: 12px; }
      figcaption { margin-top: 8px; font-weight: 600; }
      blockquote { border-left: 4px solid #d0d7de; margin: 16px 0; padding: 4px 16px; color: #57606a; }
    </style>
  </head>
  <body>
    <header><img src="logo.svg" width="48" height="48" /><strong>Corner Store</strong></header>
    <main>
      <h1>New arrivals</h1>
      <div class="grid">
        <figure><img src="mug.svg" alt="IMG_2034.jpg" /><figcaption>Blue ceramic mug — $14</figcaption></figure>
        <figure><img src="umbrella.svg" alt="Ceramic coffee mug" /><figcaption>Rain umbrella — $22</figcaption></figure>
        <figure><img src="plant.svg" alt="product" /><figcaption>Potted plant — $18</figcaption></figure>
        <figure>
          <img src="../non-text-content/dog.svg" alt="Toto, our store mascot: a smiling cartoon dog with a red collar" />
          <figcaption>Meet Toto</figcaption>
        </figure>
      </div>
      <h2>What customers say</h2>
      <blockquote lang="es"><p>Prachtige mok, de koffie blijft lang warm. Ik koop er zeker nog een!</p></blockquote>
      <blockquote lang="pt-BR"><p>Entrega rápida e o guarda-chuva é muito resistente. Recomendo!</p></blockquote>
    </main>
  </body>
</html>
