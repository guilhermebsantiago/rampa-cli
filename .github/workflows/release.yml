name: release

# Pushing a version tag, such as v0.2.0, publishes that version of rampa-cli to npm with
# provenance and creates its GitHub release. No npm token is stored anywhere: npm trusts this
# workflow file through OIDC (trusted publishing). RELEASING.md has the one-time setup on
# npmjs.com and the steps of a release.
#
# Three jobs, so each holds only the permission it needs. `build` runs the dependencies, the
# tests and the build with a read-only token. `publish` gets the OIDC token and runs nothing
# but npm on the tarball `build` made. `github-release` writes the release.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Node.js 24, as in ci.yml. Its corepack runs the pnpm that package.json pins.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false # no cache in a release build

      - name: Check that the tag names the version in package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match package.json, whose version is $version. Tag v$version, or bump the version and tag again."
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          node scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/release/notes.md"

      - name: Install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack pnpm install --frozen-lockfile

      - run: corepack pnpm typecheck

      - run: corepack pnpm test
        env:
          # GitHub's Ubuntu runners ship Google Chrome.
          RAMPA_BROWSER_CHANNEL: chrome

      - run: corepack pnpm build

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          corepack pnpm pack --pack-destination "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/rampa-cli-$VERSION.tgz"

      # The tarball as a user gets it: installed into an empty project, the command must run.
      - name: Install the tarball and run it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install --prefix "$RUNNER_TEMP/smoke" --no-save --no-audit --no-fund --ignore-scripts "$RUNNER_TEMP/release/rampa-cli-$VERSION.tgz"
          installed=$("$RUNNER_TEMP/smoke/node_modules/.bin/rampa" --version)
          if [ "$installed" != "$VERSION" ]; then
            echo "::error::The packed rampa reports version '$installed', not $VERSION."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Name this environment in the trusted publisher on npmjs.com, and only jobs that use it can
    # publish; its settings on GitHub can also limit it to v* tags or ask for an approval.
    environment:
      name: npm
      url: https://www.npmjs.com/package/rampa-cli/v/${{ needs.build.outputs.version }}
    permissions:
      id-token: write # the OIDC token npm trades for a publish token, and that signs the provenance
    steps:
      # No registry-url: there is no .npmrc and no token; npm finds the OIDC token by itself.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Check that npm can publish with OIDC
        run: |
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::Trusted publishing needs npm 11.5.1 or later; this runner has npm $npm_version."
            exit 1
          fi
          echo "npm $npm_version"

      - name: Publish to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          # The oidc lines say why, if npm could not trade the OIDC token.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          tag=latest
          if [ "$PRERELEASE" = true ]; then tag=next; fi
          npm publish "$RUNNER_TEMP/release/rampa-cli-$VERSION.tgz" --provenance --access public --tag "$tag"

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$RUNNER_TEMP/release/rampa-cli-$VERSION.tgz" \
            --verify-tag \
            --title "rampa-cli $VERSION" \
            --notes-file "$RUNNER_TEMP/release/notes.md" \
            "${prerelease[@]}"
