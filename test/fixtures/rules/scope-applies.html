<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout · Corner Store</title>
</head>
<body>
<main>
  <h1>Checkout</h1>
  <h2>Order summary</h2>
  <p>Two mugs, 24 dollars. You can cancel within 14 days.</p>
  <form id="checkout" action="/orders" method="post">
    <label for="card">Card number</label> <input id="card" name="cardnumber" autocomplete="cc-number" inputmode="numeric">
    <label for="exp">Expiry</label> <input id="exp" name="exp" autocomplete="cc-exp">
    <label for="cvc">Security code</label> <input id="cvc" name="cvc" autocomplete="cc-csc">
    <label><input type="checkbox" name="reviewed"> I have reviewed my order</label>
    <button type="submit">Place order</button>
  </form>
  <form id="settings" action="/account" method="post">
    <button type="submit">Delete my account</button>
  </form>
  <form id="quiz" action="/quiz" method="post">
    <label>2 + 2 = <input name="q1"></label>
    <button>Submit answers</button>
  </form>
</main>
<script>
  // The page responds to tilting the phone: a level that moves with the device.
  window.addEventListener('devicemotion', function (event) {
    document.body.dataset.tilt = String(event.accelerationIncludingGravity && event.accelerationIncludingGravity.x)
  })
</script>
</body>
</html>
