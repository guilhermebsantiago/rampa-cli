<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orders · Acme</title>
</head>
<body>
  <main>
    <h1>Orders</h1>

    <table id="rates">
      <thead><tr><th>Rate</th><th>Value</th></tr></thead>
      <tbody><tr><td>15%</td><td>US$ 3</td></tr></tbody>
    </table>

    <table id="layout" role="presentation">
      <tr><td>Region</td><td>Days</td></tr>
      <tr><td>North</td><td>3</td></tr>
    </table>

    <div class="row">
      <label for="order">Order number</label>
      <input id="order" type="text" placeholder="e.g. 10-2034">
    </div>

    <section class="card"><h2 id="card-1-title">Blue mug</h2><button type="button" aria-labelledby="card-1-title">Add</button></section>
    <section class="card"><h2 id="card-2-title">Red kettle</h2><button type="button" aria-labelledby="card-2-title">Add</button></section>
  </main>
</body>
</html>
