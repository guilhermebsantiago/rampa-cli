<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account settings · Acme</title>
  <style>
    .btn { display: inline-block; padding: 6px 12px; background: #1d4ed8; color: #fff; cursor: pointer; }
    [role="tab"] { display: inline-block; padding: 4px 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Account settings</h1>

    <!-- 4.1.2, widget-name: the second tree item shows only an icon hidden from assistive technology, so it has no
         name. axe-core checks tree items only as best practice. -->
    <ul role="tree" aria-label="Folders" id="folders">
      <li role="treeitem" aria-selected="true" tabindex="0">Inbox</li>
      <li role="treeitem" aria-selected="false" tabindex="-1" id="icon-item"><svg aria-hidden="true" width="16" height="16"><circle cx="8" cy="8" r="6"/></svg></li>
    </ul>

    <!-- 4.1.2, custom-control (F59): focusable, listens to click, and exposed with no role. -->
    <div class="btn" tabindex="0" id="save">Save draft</div>

    <!-- 4.1.2, tab-state: no tab says it is the selected one. -->
    <div role="tablist" aria-label="Plans" id="plans">
      <div role="tab" tabindex="0">Monthly</div>
      <div role="tab" tabindex="-1">Yearly</div>
    </div>

    <!-- 4.1.2, disclosure-state (review): the button shows and hides the answer and never says whether it is open. -->
    <button type="button" aria-controls="answer" id="question">Shipping times</button>
    <div id="answer" hidden>Two working days.</div>

    <!-- 2.5.3, button-label-in-name: the button shows "Send" and is named otherwise. -->
    <form action="#" onsubmit="return false">
      <input type="submit" value="Send" aria-label="Submit the form" id="send">
    </form>

    <!-- 4.1.3: a status region, recorded in the inventory, never a failure. -->
    <div role="status" id="saved"></div>
  </main>
  <script>
    document.getElementById('save').addEventListener('click', () => { document.getElementById('saved').textContent = 'Draft saved' })
  </script>
</body>
</html>
