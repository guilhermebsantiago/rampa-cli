<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>permissive</title>
  </head>
  <body>
    <main>
      <form>
        <label for="cep">CEP</label>
        <input id="cep" name="cep" pattern="[0-9]{5}-?[0-9]{3}" />
        <label for="cel">Celular</label>
        <input type="tel" id="cel" name="celular" pattern="[\d\(\)+\s\-]{8,20}" />
        <label for="card">Número do cartão</label>
        <input id="card" autocomplete="cc-number" pattern="[0-9 ]{13,19}" maxlength="19" />
      </form>
    </main>
  </body>
</html>
