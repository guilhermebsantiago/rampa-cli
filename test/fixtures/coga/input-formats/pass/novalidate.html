<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>novalidate</title>
  </head>
  <body>
    <main>
      <form novalidate>
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" pattern="\d{11}" maxlength="11" />
      </form>
    </main>
  </body>
</html>
