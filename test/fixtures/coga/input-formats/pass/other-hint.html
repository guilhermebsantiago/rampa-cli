<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>other-hint</title>
  </head>
  <body>
    <main>
      <form>
        <div>
          <label for="cpf">CPF</label>
          <input id="cpf" name="cpf" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" />
        </div>
        <div>
          <label for="tel">Telefone</label>
          <input type="tel" id="tel" name="tel" />
          <span>Ex.: (11) 91234-5678</span>
        </div>
      </form>
    </main>
  </body>
</html>
