<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>govuk</title>
  </head>
  <body>
    <main>
      <form novalidate>
        <label class="govuk-label" for="card-number">Card number</label>
        <input class="govuk-input" id="card-number" name="cardNumber" type="text" inputmode="numeric" pattern="[0-9]*" spellcheck="false" autocomplete="cc-number" />
      </form>
    </main>
  </body>
</html>
