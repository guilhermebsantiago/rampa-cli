<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>phone-pattern</title>
  </head>
  <body>
    <main>
      <form>
        <label for="cel">Celular</label>
        <input type="tel" id="cel" name="celular" pattern="[0-9]{11}" maxlength="11" />
      </form>
    </main>
  </body>
</html>
