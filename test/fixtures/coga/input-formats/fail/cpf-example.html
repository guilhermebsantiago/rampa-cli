<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>cpf-example</title>
  </head>
  <body>
    <main>
      <form>
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" pattern="\d{11}" aria-describedby="cpf-hint" />
        <span id="cpf-hint">Ex.: 123.456.789-09</span>
      </form>
    </main>
  </body>
</html>
