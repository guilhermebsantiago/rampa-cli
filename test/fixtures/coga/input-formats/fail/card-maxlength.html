<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>card-maxlength</title>
  </head>
  <body>
    <main>
      <form>
        <label for="card">Número do cartão</label>
        <input id="card" name="card" autocomplete="cc-number" inputmode="numeric" maxlength="16" />
      </form>
    </main>
  </body>
</html>
