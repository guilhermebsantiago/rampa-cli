<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Links</title>
<style>body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; margin: 0; color: #1a1a1a; background: #fff } main { max-width: 30em; margin: 0 auto; padding: 1em } .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0 } </style>
</head>
<body>
<main>
<p><a href="https://a.example.org" target="_blank">Portal da Transparência (abre em nova aba)</a></p>
<p><a href="https://b.example.org" target="_blank">Annual report <span class="sr-only">(opens in a new tab)</span></a></p>
<p><a href="https://c.example.org" target="_blank" aria-describedby="nova-janela">Ouvidoria</a> <span id="nova-janela" hidden>Abre em uma nova janela</span></p>
<p><a href="https://d.example.org" target="_blank" title="Abre numa nova janela">Dados abertos</a></p>
<p><a href="https://e.example.org" target="_blank">Mapa <svg width="12" height="12" role="img" aria-label="nova janela"><path d="M0 0h12v12H0z"/></svg></a></p>
<p><a href="https://f.example.org" target="_blank">Informe anual (se abre en una nueva pestaña)</a></p>
<p><a href="https://g.example.org" target="_blank" aria-label="Diário Oficial, abre em outra aba">Diário Oficial</a></p>
</main>
</body>
</html>
