<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A small cookie bar</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  main { max-width: 900px; }
  .cookie-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #222; color: #fff; padding: 12px; }
</style>
</head>
<body>
<main>
<h1>A small cookie bar</h1>
<p>Our office answers questions about your application. Read the steps below before you start, and keep your documents at hand.</p>
<div id="cookies" class="cookie-bar">We use cookies. <a href="#privacy">Privacy</a> <button type="button">OK</button></div>
<p>More text about the service, with a <a href="#help">link to help</a> and a <button type="button">Next step</button> button.</p>
</main>

</body>
</html>
