<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A cookie wall</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  main { max-width: 900px; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; }
  .backdrop .box { background: #fff; width: 420px; margin: 120px auto; padding: 24px; }
</style>
</head>
<body>
<main>
<h1>A cookie wall</h1>
<p>Our office answers questions about your application. Read the steps below before you start, and keep your documents at hand.</p>
<div class="backdrop" id="consent" style="display:block">
  <div class="box" role="dialog" aria-modal="true" aria-label="Cookies" id="consent-box">
    <p>We use cookies to improve your experience. Accept all cookies or choose which ones to allow.</p>
    <button type="button">Accept all</button> <button type="button">Choose</button>
  </div>
</div>
<p>More text about the service, with a <a href="#help">link to help</a> and a <button type="button">Next step</button> button.</p>
</main>

</body>
</html>
