<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Every field refuses pasting</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  main { max-width: 900px; }

</style>
</head>
<body>
<main>
<h1>Every field refuses pasting</h1>
<p>Our office answers questions about your application. Read the steps below before you start, and keep your documents at hand.</p>
<form action="#">
  <p><label for="name">Name</label> <input id="name"></p>
  <p><label for="phone">Phone</label> <input id="phone" type="tel"></p>
  <p><label for="city">City</label> <input id="city"></p>
</form>
<p>More text about the service, with a <a href="#help">link to help</a> and a <button type="button">Next step</button> button.</p>
</main>
<script>
  document.addEventListener('paste', (event) => event.preventDefault(), true)
</script>
</body>
</html>
