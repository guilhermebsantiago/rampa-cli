<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  main { max-width: 900px; }

</style>
</head>
<body>
<main>
<h1>Sign in</h1>
<p>Our office answers questions about your application. Read the steps below before you start, and keep your documents at hand.</p>
<form id="login" action="#">
  <p><label for="user">E-mail</label> <input id="user" type="email" autocomplete="username"></p>
  <p><label for="pass">Password</label> <input id="pass" type="password" autocomplete="current-password" onpaste="return false"></p>
  <p><button>Sign in</button></p>
</form>
<p>More text about the service, with a <a href="#help">link to help</a> and a <button type="button">Next step</button> button.</p>
</main>

</body>
</html>
