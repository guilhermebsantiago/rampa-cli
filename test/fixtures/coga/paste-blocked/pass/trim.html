<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A field that tidies what is pasted</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  main { max-width: 900px; }

</style>
</head>
<body>
<main>
<h1>A field that tidies what is pasted</h1>
<p>Our office answers questions about your application. Read the steps below before you start, and keep your documents at hand.</p>
<p><label for="cpf">CPF</label> <input id="cpf" inputmode="numeric"></p>
<p>More text about the service, with a <a href="#help">link to help</a> and a <button type="button">Next step</button> button.</p>
</main>
<script>
  document.getElementById('cpf').addEventListener('paste', (event) => {
    event.preventDefault()
    event.target.value = event.clipboardData.getData('text').replace(/\D/g, '')
  })
</script>
</body>
</html>
