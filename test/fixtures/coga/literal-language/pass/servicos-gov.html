<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Consultar contribuições</title>
  </head>
  <body>
    <header>
      <nav aria-label="Menu principal">
        <a href="/servicos">Serviços</a>
        <a href="/orgaos">Órgãos do governo</a>
        <a href="/ajuda">Precisa de ajuda?</a>
      </nav>
    </header>
    <main>
      <h1>Consultar contribuições</h1>
      <form>
        <label for="cpf">CPF</label>
        <p id="cpf-dica">Digite os 11 números do CPF, sem pontos nem traço.</p>
        <input id="cpf" name="cpf" inputmode="numeric" aria-describedby="cpf-dica" />
        <button type="submit">Consultar contribuições</button>
      </form>
      <h2>Serviços em destaque</h2>
      <p><a href="/extrato">Emitir extrato de contribuições</a></p>
      <p><a href="/carteira">Consultar carteira de trabalho</a></p>
    </main>
  </body>
</html>
