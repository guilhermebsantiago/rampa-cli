<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Change your address</title>
  </head>
  <body>
    <main>
      <h1>Change your address</h1>
      <p>Tell us your new address. We will send a letter to it within 5 working days.</p>
      <form>
        <label for="line1">Building and street</label>
        <input id="line1" name="line1" autocomplete="address-line1" />
        <label for="postcode">Postcode</label>
        <p id="postcode-hint">For example, SW1A 1AA.</p>
        <input id="postcode" name="postcode" aria-describedby="postcode-hint" autocomplete="postal-code" />
        <label for="moved">Date you moved</label>
        <input id="moved" name="moved" type="date" />
        <button type="submit">Save and continue</button>
      </form>
      <p><a href="/help/address">Get help with changing your address</a></p>
    </main>
  </body>
</html>
