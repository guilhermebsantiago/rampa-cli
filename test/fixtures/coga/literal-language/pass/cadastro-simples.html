<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Crie sua conta</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Página inicial</a>
        <a href="/entrar">Entrar</a>
        <a href="/ajuda">Central de ajuda</a>
      </nav>
    </header>
    <main>
      <h1>Crie sua conta</h1>
      <form>
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" autocomplete="name" />
        <label for="email">E-mail</label>
        <p id="email-dica">Vamos mandar um código para este e-mail.</p>
        <input id="email" name="email" type="email" aria-describedby="email-dica" autocomplete="email" />
        <label for="telefone">Telefone com DDD</label>
        <input id="telefone" name="telefone" type="tel" autocomplete="tel" />
        <button type="submit">Criar conta</button>
      </form>
      <p><a href="/entrar">Já tenho conta</a> · <a href="/senha">Esqueci minha senha</a></p>
    </main>
  </body>
</html>
