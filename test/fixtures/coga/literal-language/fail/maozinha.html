<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Segunda via da conta de luz</title>
  </head>
  <body>
    <main>
      <h1>Segunda via da conta de luz</h1>
      <p>Informe o número da instalação, que aparece no canto de cima da conta.</p>
      <form>
        <label for="instalacao">Número da instalação</label>
        <input id="instalacao" name="instalacao" inputmode="numeric" />
        <button type="submit">Ver a conta</button>
      </form>
      <section>
        <h2>Precisa de uma mãozinha?</h2>
        <p>Ligue para 0800 000 0000, de segunda a sexta, das 8h às 18h.</p>
      </section>
    </main>
  </body>
</html>
