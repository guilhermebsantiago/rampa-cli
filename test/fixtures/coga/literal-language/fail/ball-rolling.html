<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Set up your account</title>
  </head>
  <body>
    <main>
      <h1>Set up your account</h1>
      <p>You need your account number and the email address you gave us.</p>
      <form>
        <label for="account">Account number</label>
        <input id="account" name="account" inputmode="numeric" />
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <button type="submit">Get the ball rolling</button>
      </form>
    </main>
  </body>
</html>
