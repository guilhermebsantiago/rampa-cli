<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Book a visit</title>
  </head>
  <body>
    <main>
      <h1>Book a visit</h1>
      <form>
        <label for="date">Date of the visit</label>
        <input id="date" name="date" type="date" />
        <input id="terms" name="terms" type="checkbox" />
        <label for="terms">I have read the visiting rules</label>
        <p role="alert">Hold your horses! Tick the box to say you have read the visiting rules.</p>
        <button type="submit">Book the visit</button>
      </form>
    </main>
  </body>
</html>
