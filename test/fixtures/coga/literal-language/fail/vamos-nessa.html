<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Agendamento</title>
  </head>
  <body>
    <main>
      <h1>Agende seu atendimento</h1>
      <form>
        <fieldset>
          <legend>Escolha o dia</legend>
          <input type="radio" id="seg" name="dia" value="seg" />
          <label for="seg">Segunda-feira</label>
          <input type="radio" id="qua" name="dia" value="qua" />
          <label for="qua">Quarta-feira</label>
        </fieldset>
        <button type="submit">Vamos nessa?</button>
      </form>
    </main>
  </body>
</html>
