<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Inscrição no curso</title>
  </head>
  <body>
    <main>
      <h1>Inscrição no curso de informática básica</h1>
      <p>As aulas começam em março, às terças e quintas, das 19h às 21h.</p>
      <form>
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" autocomplete="name" />
        <label for="telefone">Telefone com DDD</label>
        <input id="telefone" name="telefone" type="tel" autocomplete="tel" />
        <button type="submit">Bata o martelo e garanta sua vaga</button>
      </form>
    </main>
  </body>
</html>
