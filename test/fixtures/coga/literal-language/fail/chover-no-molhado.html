<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Atualize seu cadastro</title>
  </head>
  <body>
    <main>
      <h1>Atualize seu cadastro</h1>
      <form>
        <label for="documentos">Documentos</label>
        <p id="documentos-dica">Não precisa chover no molhado: envie só os documentos que mudaram desde o último pedido.</p>
        <input id="documentos" name="documentos" type="file" aria-describedby="documentos-dica" />
        <button type="submit">Enviar documentos</button>
      </form>
    </main>
  </body>
</html>
