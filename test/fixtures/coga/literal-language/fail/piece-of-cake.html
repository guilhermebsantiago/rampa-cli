<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Choose a password</title>
  </head>
  <body>
    <main>
      <h1>Choose a password</h1>
      <form>
        <label for="password">Password</label>
        <p id="password-hint">This part is a piece of cake: pick 8 letters or more that you will remember.</p>
        <input id="password" name="password" type="password" aria-describedby="password-hint" autocomplete="new-password" />
        <button type="submit">Save password</button>
      </form>
    </main>
  </body>
</html>
