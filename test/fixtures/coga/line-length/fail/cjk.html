<p id="juminhyo">このページでは、住民登録の手続きについて説明します。引っ越しをしたときは、新しい住所に住み始めてから十四日以内に、市役所の窓口で届け出をしてください。届け出には、本人確認書類と印鑑が必要です。代理の人が手続きをする場合は、委任状も持ってきてください。窓口は平日の午前八時半から午後五時まで開いています。混雑する月曜日の午前中は、待ち時間が長くなることがあります。</p>
