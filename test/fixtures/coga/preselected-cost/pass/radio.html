<html lang="pt-BR">

    <title>radio</title>

  <body>
    <main>
      <form>
        <fieldset>
          <legend>Frete</legend>
          <label><input type="radio" name="frete" value="normal" checked /> Normal, R$ 15,00</label>

        </fieldset>
      </form>
    </main>
