<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion only with the setting</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  main { max-width: 900px; }
  .pulse { width: 80px; padding: 8px; background: #fd0; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: pulse 2s ease-in-out infinite; } }
</style>
</head>
<body>
<main>
<h1>Motion only with the setting</h1>
<p>Our office answers questions about your application. Read the steps below before you start, and keep your documents at hand.</p>
<div class="pulse" id="badge">New</div>
<p>More text about the service, with a <a href="#help">link to help</a> and a <button type="button">Next step</button> button.</p>
</main>

</body>
</html>
