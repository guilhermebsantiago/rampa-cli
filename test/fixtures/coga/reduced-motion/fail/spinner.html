<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spinner that ignores the setting</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  main { max-width: 900px; }
  .spinner { width: 48px; height: 48px; border: 6px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
<h1>Spinner that ignores the setting</h1>
<p>Our office answers questions about your application. Read the steps below before you start, and keep your documents at hand.</p>
<div class="spinner" id="loader" role="img" aria-label="Loading"></div>
<p>More text about the service, with a <a href="#help">link to help</a> and a <button type="button">Next step</button> button.</p>
</main>

</body>
</html>
