<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Erro no CPF</title>
  </head>
  <body>
    <main>
      <h1>Consulte sua restituição</h1>
      <form novalidate>
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" inputmode="numeric" value="123.456.789" aria-invalid="true" aria-describedby="cpf-erro" />
        <p id="cpf-erro" class="erro">Erro inesperado. Tente novamente mais tarde.</p>
        <button type="submit">Consultar</button>
      </form>
    </main>
  </body>
</html>
