<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Consulta de restituição</title>
  </head>
  <body>
    <main>
      <h1>Consulte sua restituição</h1>
      <form novalidate>
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" inputmode="numeric" value="123.456.789" aria-invalid="true" aria-describedby="cpf-erro" />
        <div id="cpf-erro" role="alert">Erro 0x13</div>
        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" type="date" />
        <button type="submit">Consultar</button>
      </form>
    </main>
  </body>
</html>
