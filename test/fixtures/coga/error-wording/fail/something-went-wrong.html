<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign up for updates</title>
  </head>
  <body>
    <main>
      <h1>Sign up for updates</h1>
      <form novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" value="maria@example" aria-invalid="true" aria-describedby="email-error" />
        <span id="email-error" class="error-message">Something went wrong. Please try again.</span>
        <button type="submit">Sign up</button>
      </form>
    </main>
  </body>
</html>
