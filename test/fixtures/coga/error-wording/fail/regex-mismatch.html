<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Find your council</title>
  </head>
  <body>
    <main>
      <h1>Find your local council</h1>
      <form novalidate>
        <label for="zip">ZIP code</label>
        <input id="zip" name="zip" inputmode="numeric" value="9021" aria-invalid="true" aria-describedby="zip-error" />
        <p id="zip-error" class="field-error">Validation error: value does not match ^\d{5}$</p>
        <button type="submit">Search</button>
      </form>
    </main>
  </body>
</html>
