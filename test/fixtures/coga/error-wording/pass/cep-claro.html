<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Endereço de entrega</title>
  </head>
  <body>
    <main>
      <h1>Endereço de entrega</h1>
      <form novalidate>
        <label for="cep">CEP</label>
        <input id="cep" name="cep" inputmode="numeric" autocomplete="postal-code" value="0131" aria-invalid="true" aria-describedby="cep-erro" />
        <p id="cep-erro" class="erro">O CEP tem 8 números. Digite o CEP completo, por exemplo 01310-100.</p>
        <button type="submit">Continuar</button>
      </form>
    </main>
  </body>
</html>
