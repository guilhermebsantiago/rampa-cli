<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact details</title>
  </head>
  <body>
    <main>
      <h1>Your contact details</h1>
      <form novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" value="maria.example.com" aria-invalid="true" aria-errormessage="email-error" />
        <span id="email-error" class="error-message">Enter an email address in the correct format, like name@example.com</span>
        <button type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
