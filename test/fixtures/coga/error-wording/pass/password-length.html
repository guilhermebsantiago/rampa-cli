<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create a password</title>
  </head>
  <body>
    <main>
      <h1>Create a password</h1>
      <form novalidate>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" aria-invalid="true" aria-describedby="password-error" />
        <p id="password-error" class="error-message">Your password must be at least 8 characters long. Add more letters or numbers.</p>
        <button type="submit">Create account</button>
      </form>
    </main>
  </body>
</html>
