<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Cadastro</title>
  </head>
  <body>
    <main>
      <h1>Seus dados</h1>
      <form novalidate>
        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" value="31/02/1990" aria-invalid="true" aria-describedby="nascimento-erro" />
        <p id="nascimento-erro" class="erro">Essa data não existe. Digite dia, mês e ano com números, por exemplo 25/12/1990.</p>
        <button type="submit">Salvar</button>
      </form>
    </main>
  </body>
</html>
