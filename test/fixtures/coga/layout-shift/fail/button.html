<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A button pushed aside</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  main { max-width: 900px; }

</style>
</head>
<body>
<main>
<h1>A button pushed aside</h1>
<p>Our office answers questions about your application. Read the steps below before you start, and keep your documents at hand.</p>
<div id="row"><span id="before"></span><button type="button" id="pay">Pay the fee</button></div>
<p>More text about the service, with a <a href="#help">link to help</a> and a <button type="button">Next step</button> button.</p>
</main>
<script>
  addEventListener('load', () => setTimeout(() => { document.getElementById('before').textContent = 'Total with taxes and service charges: R$ 120,00 ' }, 400))
</script>
</body>
</html>
