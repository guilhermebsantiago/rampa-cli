<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>label-and-placeholder</title>
  </head>
  <body>
    <main>
      <form>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="nome@exemplo.com" />
      </form>
    </main>
  </body>
</html>
