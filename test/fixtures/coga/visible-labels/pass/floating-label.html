<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>floating-label</title>
  </head>
  <body>
    <main>
      <form>
        <div class="field">
          <input id="cidade" name="cidade" placeholder="Ex.: Recife" />
          <label for="cidade">Cidade</label>
        </div>
      </form>
    </main>
  </body>
</html>
