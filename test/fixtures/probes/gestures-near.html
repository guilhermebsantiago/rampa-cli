<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbour shop: near misses for gestures</title>
<style>
  body { font: 16px/1.4 Arial, sans-serif; margin: 24px; max-width: 760px; }
  .strip { display: flex; gap: 8px; width: 480px; overflow-x: auto; scroll-snap-type: x mandatory; border: 1px solid #333; margin-bottom: 24px; }
  .strip div { flex: 0 0 200px; height: 120px; scroll-snap-align: start; color: #fff; padding: 8px; box-sizing: border-box; }
  .carousel { position: relative; width: 480px; height: 160px; overflow: hidden; border: 1px solid #333; touch-action: pan-y; }
  .track { display: flex; height: 100%; transition: transform 300ms ease; }
  .track figure { flex: 0 0 100%; margin: 0; padding: 56px 16px; box-sizing: border-box; color: #fff; font-size: 20px; }
  .controls { margin: 8px 0 24px; }
  .pad { width: 480px; height: 140px; border: 1px dashed #333; display: grid; place-items: center; }
</style>
</head>
<body>
<main>
  <h1>Harbour shop</h1>

  <h2>Postcards</h2>
  <!-- The browser scrolls it; the page's touch listeners only count, for analytics. -->
  <div class="strip" id="strip" aria-label="Postcards">
    <div style="background:#036">Dawn</div>
    <div style="background:#630">Noon</div>
    <div style="background:#063">Lighthouse</div>
    <div style="background:#306">Night</div>
  </div>

  <h2>Quotes</h2>
  <!-- A swipe moves one quote; the button moves two: something else. -->
  <div class="carousel" id="quotes" aria-roledescription="carousel" aria-label="Quotes">
    <div class="track">
      <figure style="background:#036">"Best tour in town"</figure>
      <figure style="background:#630">"Loved the lighthouse"</figure>
      <figure style="background:#063">"Great guides"</figure>
      <figure style="background:#306">"We will be back"</figure>
      <figure style="background:#333">"Bring a jacket"</figure>
    </div>
  </div>
  <div class="controls">
    <button type="button" id="quotes-skip">Next page of quotes</button>
  </div>

  <h2>Feedback</h2>
  <!-- Touch listeners that only record timings; nothing on the page changes. -->
  <div class="pad" id="pad">Tell us how the tour went</div>
</main>
<script>
  let touches = 0
  const strip = document.getElementById('strip')
  strip.addEventListener('touchstart', () => { touches++ }, { passive: true })
  strip.addEventListener('touchmove', () => { touches++ }, { passive: true })

  const root = document.getElementById('quotes')
  const track = root.querySelector('.track')
  const count = track.children.length
  let index = 0
  let startX = null
  const show = (i) => {
    index = (i + count) % count
    track.style.transform = `translateX(${-100 * index}%)`
  }
  root.addEventListener('touchstart', (event) => { startX = event.touches[0].clientX })
  root.addEventListener('touchmove', () => {})
  root.addEventListener('touchend', (event) => {
    if (startX === null) return
    const dx = event.changedTouches[0].clientX - startX
    startX = null
    if (dx <= -40) show(index + 1)
    else if (dx >= 40) show(index - 1)
  })
  document.getElementById('quotes-skip').addEventListener('click', () => show(index + 2))

  const timings = []
  const pad = document.getElementById('pad')
  pad.addEventListener('touchstart', (event) => timings.push(event.timeStamp))
  pad.addEventListener('touchmove', (event) => timings.push(event.timeStamp))
</script>
</body>
</html>
