<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account: focus management that works</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 20px; }
  [hidden] { display: none !important; }
  .modal { position: fixed; top: 20%; left: 20%; width: 50%; background: #fff; border: 2px solid #000; padding: 16px; z-index: 10; }
  .menu { list-style: none; padding: 4px; margin: 0; border: 1px solid #888; background: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 480px; }
</style>
</head>
<body>
<header><a href="#main">Skip to content</a> <a href="/focus-order/home.html">Home</a></header>
<main id="main">
  <h1>Account</h1>
  <!-- A native modal dialog: showModal moves focus in, keeps the page behind inert, and Esc gives focus back. -->
  <p><button id="open-native" type="button" aria-haspopup="dialog" aria-controls="native">Change the password</button></p>
  <dialog id="native" aria-label="Change the password"><p>We will send you a link.</p><button id="native-close" type="button">Close</button></dialog>
  <!-- A dialog built as the APG says: focus in, Tab kept inside, Esc closes and gives focus back. -->
  <p><button id="open-custom" type="button" aria-haspopup="dialog" aria-controls="custom">Edit the address</button></p>
  <div id="custom" class="modal" role="dialog" aria-modal="true" aria-label="Edit the address" hidden>
    <label>Street <input id="custom-street"></label>
    <button id="custom-close" type="button">Close</button>
  </div>
  <!-- A menu button: focus to the first item, Esc closes it and gives focus back. -->
  <p><button id="open-menu" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="actions">Actions</button></p>
  <ul id="actions" class="menu" role="menu" hidden>
    <li role="none"><a role="menuitem" href="/focus-order/export.html" id="export">Export</a></li>
    <li role="none"><a role="menuitem" href="/focus-order/print.html">Print</a></li>
  </ul>
  <!-- A disclosure right after its button: the next Tab is in it. -->
  <p><button id="toggle-more" type="button" aria-expanded="false" aria-controls="more">More options</button></p>
  <div id="more" hidden><a href="/focus-order/history.html">History</a></div>
  <!-- A form laid out in two columns, read row by row, as its DOM goes. -->
  <form class="grid" aria-label="Contact">
    <label>First name <input id="first"></label>
    <label>Last name <input id="last"></label>
    <label>Email <input id="email"></label>
    <label>Phone <input id="phone"></label>
  </form>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  $('open-native').addEventListener('click', () => $('native').showModal())
  $('native-close').addEventListener('click', () => $('native').close())
  let returnTo = null
  const custom = $('custom')
  $('open-custom').addEventListener('click', () => { returnTo = $('open-custom'); custom.hidden = false; $('custom-street').focus() })
  const closeCustom = () => { custom.hidden = true; returnTo?.focus() }
  $('custom-close').addEventListener('click', closeCustom)
  custom.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { event.preventDefault(); closeCustom() }
    if (event.key === 'Tab') {
      const items = [$('custom-street'), $('custom-close')]
      const i = items.indexOf(document.activeElement)
      event.preventDefault()
      items[(i + (event.shiftKey ? items.length - 1 : 1)) % items.length].focus()
    }
  })
  const menu = $('actions')
  const menuButton = $('open-menu')
  const closeMenu = () => { menu.hidden = true; menuButton.setAttribute('aria-expanded', 'false'); menuButton.focus() }
  menuButton.addEventListener('click', () => { menu.hidden = false; menuButton.setAttribute('aria-expanded', 'true'); $('export').focus() })
  menu.addEventListener('keydown', (event) => { if (event.key === 'Escape') { event.preventDefault(); closeMenu() } })
  $('toggle-more').addEventListener('click', () => { const open = $('toggle-more').getAttribute('aria-expanded') !== 'true'; $('toggle-more').setAttribute('aria-expanded', String(open)); $('more').hidden = !open })
</script>
</body>
</html>
