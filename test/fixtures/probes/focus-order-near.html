<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop: near misses for focus management</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 20px; }
  [hidden] { display: none !important; }
  .modal { position: fixed; top: 20%; left: 20%; width: 50%; background: #fff; border: 2px solid #000; padding: 16px; z-index: 10; }
  .columns { display: flex; gap: 48px; }
  .columns ul { list-style: none; padding: 0; }
</style>
</head>
<body>
<header><a href="#main" id="skip" tabindex="1">Skip to content</a> <a href="/focus-order/home.html">Home</a></header>
<main id="main">
  <h1>Shop</h1>
  <!-- A dialog that is not modal, right after its button: it does not take focus, and the next Tab is in it (SCR37). -->
  <p><button id="open-tip" type="button" aria-haspopup="dialog" aria-controls="tip">Size guide</button></p>
  <div id="tip" role="dialog" aria-label="Size guide" hidden><p>Measure your chest.</p><a href="/focus-order/sizes.html">All sizes</a></div>
  <!-- A coupon whose button goes away once it is claimed: focus goes on to the next step, for a person to judge. -->
  <p id="coupon-row"><button id="open-coupon" type="button" aria-haspopup="dialog" aria-controls="coupon">Show the coupon</button></p>
  <div id="coupon" class="modal" role="dialog" aria-modal="true" aria-label="Coupon" hidden><p>Your code is SAVE10.</p><button id="coupon-close" type="button">Done</button></div>
  <p><a href="/focus-order/cart.html" id="next-step">Go to the cart</a></p>
  <!-- On the skip list: never opened. -->
  <p><button id="open-delete" type="button" aria-haspopup="dialog" aria-controls="confirm-delete">Delete account</button></p>
  <div id="confirm-delete" class="modal" role="dialog" aria-modal="true" aria-label="Delete account" hidden><button type="button">Yes</button></div>
  <!-- A dialog nothing ties to its button but its name: a guess, which works. -->
  <p><button id="open-settings" type="button">Open settings</button></p>
  <!-- Links in columns, read down each column: Tab goes up and to the right between them, which is no step back. -->
  <nav class="columns" aria-label="Footer">
    <ul><li><a href="/focus-order/about.html">About</a></li><li><a href="/focus-order/jobs.html">Jobs</a></li><li><a href="/focus-order/press.html">Press</a></li></ul>
    <ul><li><a href="/focus-order/help.html">Help</a></li><li><a href="/focus-order/returns.html">Returns</a></li><li><a href="/focus-order/shipping.html">Shipping</a></li></ul>
  </nav>
</main>
<div id="settings" class="modal" role="dialog" aria-modal="true" aria-label="Settings" hidden><label><input type="checkbox" id="dark"> Dark theme</label> <button id="settings-close" type="button">Close</button></div>
<script>
  const $ = (id) => document.getElementById(id)
  $('open-tip').addEventListener('click', () => { $('tip').hidden = !$('tip').hidden })
  $('open-coupon').addEventListener('click', () => { $('coupon').hidden = false; $('coupon-close').focus() })
  $('coupon').addEventListener('keydown', (event) => { if (event.key === 'Tab') { event.preventDefault(); $('coupon-close').focus() } })
  const claim = () => { $('coupon').hidden = true; $('coupon-row').remove(); $('next-step').focus() }
  $('coupon-close').addEventListener('click', claim)
  $('coupon').addEventListener('keydown', (event) => { if (event.key === 'Escape') claim() })
  const settings = $('settings')
  $('open-settings').addEventListener('click', () => { settings.hidden = false; $('dark').focus() })
  const closeSettings = () => { settings.hidden = true; $('open-settings').focus() }
  $('settings-close').addEventListener('click', closeSettings)
  settings.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeSettings()
    if (event.key === 'Tab') { event.preventDefault(); (document.activeElement === $('dark') ? $('settings-close') : $('dark')).focus() }
  })
</script>
</body>
</html>
