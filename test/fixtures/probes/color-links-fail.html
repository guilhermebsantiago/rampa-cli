<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Links in text, told apart by color alone</title>
<style>
  body { font: 16px Arial, sans-serif; margin: 1rem; background: #fff; color: #444; }
  /* #006699 against #444444: 1.56:1, and nothing else sets the links apart. */
  a { color: #006699; text-decoration: none; }
  /* The block's own color is the links' color, and colors none of its text: the words around the link are gray. */
  #card { color: #006699; }
  #card span { color: #444; }
</style>
</head>
<body>
<main>
  <h1>Care guide</h1>
  <p id="running">Read the <a href="#guide">care guide</a> before your next visit, and ask your doctor what it means for you.</p>
  <div id="card"><span>Posted in</span> <a href="#news">health news</a><span>, with notes about every study we read this year.</span></div>
</main>
</body>
</html>
