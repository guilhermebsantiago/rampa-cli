<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus obscured</title>
<style>
  body { font: 16px Arial, sans-serif; margin: 0; }
  a:focus-visible { outline: 3px solid #005fcc; }
  section { height: 500px; padding: 1rem; }
  /* An opaque cookie banner over the lower third of the window. Chromium scrolls a focused element to the
     middle only when it is out of view; the second link is already in view, under the banner. */
  #cookies { position: fixed; left: 0; right: 0; bottom: 0; height: 250px; background: #222; color: #fff; padding: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Articles</h1>
  <section><a id="first" href="#1">First article</a></section>
  <section><a id="second" href="#2">Second article</a></section>
  <section><a id="third" href="#3">Third article</a></section>
</main>
<div id="cookies" role="region" aria-label="Cookies">We use cookies to measure visits.</div>
</body>
</html>
