<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Native modal</title></head>
<body>
<!-- A native modal dialog open on load: the page behind it is inert, so its link is not expected to take focus, and Esc leaves. -->
<main><h1>News</h1><a href="#a">Latest</a></main>
<dialog id="consent"><p>We use cookies.</p><button id="ok">OK</button> <button id="no">No</button></dialog>
<script>document.getElementById('consent').showModal()</script>
</body>
</html>
