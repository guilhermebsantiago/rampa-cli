<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today's news: motion with no way to stop it</title>
<style>
  body { margin: 0; font: 16px/1.4 Arial, sans-serif; color: #111; background: #fff; }
  main { padding: 16px; }
  .viewport { width: 600px; height: 120px; overflow: hidden; border: 1px solid #555; }
  .track { display: flex; margin: 0; padding: 0; list-style: none; transition: transform 0.5s ease; }
  .track li { flex: 0 0 600px; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .ticker { width: 600px; overflow: hidden; white-space: nowrap; border: 1px solid #555; margin-top: 16px; }
  .ticker span { display: inline-block; padding-left: 100%; animation: scroll 20s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
</style>
</head>
<body>
<main>
  <h1>Today's news</h1>
  <p>Stories from around the city, updated through the day.</p>
  <!-- A carousel that turns every 3 s by itself; its only button goes to the next story. -->
  <section id="news" aria-roledescription="carousel" aria-label="Top stories">
    <div class="viewport">
      <ul class="track" id="track">
        <li style="background:#dbeafe">Library opens on Main Street</li>
        <li style="background:#fde68a">River festival this weekend</li>
        <li style="background:#bbf7d0">New bus lines start Monday</li>
      </ul>
    </div>
    <button type="button" id="next">Next story</button>
  </section>
  <!-- A ticker that scrolls forever. -->
  <div class="ticker" id="ticker"><span>Markets: index up 1.2% · Weather: sunny, 24 °C · Traffic: light on the bridge</span></div>
  <!-- A counter that updates every 1.5 s. -->
  <p>Visitors online: <span id="online">120</span></p>
  <p>Read the full stories below.</p>
</main>
<script>
  let i = 0
  const track = document.getElementById('track')
  const show = (n) => { i = (n + 3) % 3; track.style.transform = 'translateX(' + (-600 * i) + 'px)' }
  setInterval(() => show(i + 1), 3000)
  document.getElementById('next').addEventListener('click', () => show(i + 1))
  let n = 120
  setInterval(() => { n = (n * 7 + 13) % 997; document.getElementById('online').textContent = String(n) }, 1500)
</script>
</body>
</html>
