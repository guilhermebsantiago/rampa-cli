<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player: drags with a single-pointer way</title>
<style>
  body { font: 16px/1.4 Arial, sans-serif; margin: 24px; max-width: 720px; }
  .field { margin: 16px 0; }
  .track { position: relative; width: 300px; height: 8px; background: #ccc; margin: 16px 0; }
  .thumb { position: absolute; top: -8px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: #036; touch-action: none; }
  ul, ol { padding-left: 20px; width: 360px; }
  li { border: 1px solid #555; margin: 4px 0; padding: 6px; background: #fff; }
  .board { display: flex; gap: 16px; }
  .column { list-style: none; padding: 4px; min-height: 120px; width: 220px; border: 1px dashed #999; }
  .carousel { width: 320px; height: 120px; overflow: hidden; border: 1px solid #333; touch-action: pan-y; }
  .carousel figure { margin: 0; padding: 40px 16px; }
</style>
</head>
<body>
<main>
  <h1>Player</h1>
  <!-- A slider with buttons that raise and lower it. -->
  <div class="field">
    <span id="vol-label">Volume</span>
    <div class="track" id="vol-track">
      <div id="vol" class="thumb" role="slider" tabindex="0" aria-labelledby="vol-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"></div>
    </div>
    <button type="button" id="vol-down" aria-label="Decrease volume">−</button>
    <button type="button" id="vol-up" aria-label="Increase volume">+</button>
  </div>
  <!-- A slider whose track takes a click. -->
  <div class="field">
    <span id="bal-label">Balance</span>
    <div class="track" id="bal-track">
      <div id="bal" class="thumb" role="slider" tabindex="0" aria-labelledby="bal-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
    </div>
  </div>
  <!-- Native: the browser's own, never listed. -->
  <label>Speed <input type="range" id="speed" min="0" max="2" step="0.25" value="1"></label>

  <h2>Recipe steps</h2>
  <ol id="steps">
    <li draggable="true"><span>Preheat the oven</span> <button type="button" aria-label="Move Preheat the oven up">↑</button> <button type="button" aria-label="Move Preheat the oven down">↓</button></li>
    <li draggable="true"><span>Mix the flour</span> <button type="button" aria-label="Move Mix the flour up">↑</button> <button type="button" aria-label="Move Mix the flour down">↓</button></li>
    <li draggable="true"><span>Bake for 30 minutes</span> <button type="button" aria-label="Move Bake for 30 minutes up">↑</button> <button type="button" aria-label="Move Bake for 30 minutes down">↓</button></li>
  </ol>

  <h2>Board</h2>
  <div class="board">
    <ul class="column" id="todo" aria-label="To do">
      <li draggable="true" class="card">Fix the login bug <select aria-label="Move to column"><option selected>To do</option><option>Doing</option></select></li>
      <li draggable="true" class="card">Write tests <select aria-label="Move to column"><option selected>To do</option><option>Doing</option></select></li>
    </ul>
    <ul class="column" id="doing" aria-label="Doing"></ul>
  </div>

  <h2>Photos</h2>
  <div class="gallery">
    <div class="carousel" id="photos" role="region" aria-label="Photos">
      <figure>Photo 1 of 3: the harbour at dawn</figure>
    </div>
    <button type="button" id="prev">Previous photo</button>
    <button type="button" id="next">Next photo</button>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  const slider = (id, track, start) => {
    const el = $(id)
    const place = (value) => {
      const v = Math.round(Math.min(100, Math.max(0, value)))
      el.setAttribute('aria-valuenow', String(v))
      el.style.left = `${v * 3}px`
    }
    place(start)
    el.addEventListener('pointerdown', (event) => {
      event.stopPropagation()
      el.setPointerCapture(event.pointerId)
      const move = (e) => place(((e.clientX - $(track).getBoundingClientRect().left) / 300) * 100)
      const up = () => {
        el.removeEventListener('pointermove', move)
        el.removeEventListener('pointerup', up)
      }
      el.addEventListener('pointermove', move)
      el.addEventListener('pointerup', up)
    })
    return place
  }
  const vol = slider('vol', 'vol-track', 20)
  $('vol-down').addEventListener('click', () => vol(Number($('vol').getAttribute('aria-valuenow')) - 10))
  $('vol-up').addEventListener('click', () => vol(Number($('vol').getAttribute('aria-valuenow')) + 10))
  const bal = slider('bal', 'bal-track', 50)
  $('bal-track').addEventListener('click', (event) => bal(((event.clientX - $('bal-track').getBoundingClientRect().left) / 300) * 100))

  // Native drag and drop, for both lists.
  let dragged = null
  const sortable = (list) => {
    list.addEventListener('dragstart', (event) => { dragged = event.target.closest('li') })
    list.addEventListener('dragover', (event) => event.preventDefault())
    list.addEventListener('drop', (event) => {
      event.preventDefault()
      const li = event.target.closest('li')
      if (!dragged || !li || dragged === li) return
      const after = event.clientY > li.getBoundingClientRect().top + li.getBoundingClientRect().height / 2
      li.parentElement.insertBefore(dragged, after ? li.nextSibling : li)
    })
  }
  for (const list of [$('steps'), $('todo'), $('doing')]) sortable(list)
  $('steps').addEventListener('click', (event) => {
    const button = event.target.closest('button')
    if (!button) return
    const li = button.closest('li')
    if (button.getAttribute('aria-label').endsWith(' up') && li.previousElementSibling) li.parentElement.insertBefore(li, li.previousElementSibling)
    if (button.getAttribute('aria-label').endsWith(' down') && li.nextElementSibling) li.parentElement.insertBefore(li.nextElementSibling, li)
  })
  for (const select of document.querySelectorAll('.card select')) {
    select.addEventListener('change', () => {
      $(select.value === 'Doing' ? 'doing' : 'todo').append(select.closest('li'))
    })
  }
  let photo = 1
  let startX = 0
  const show = (step) => {
    photo = ((photo - 1 + step + 3) % 3) + 1
    $('photos').querySelector('figure').textContent = `Photo ${photo} of 3`
  }
  $('photos').addEventListener('touchstart', (event) => { startX = event.touches[0].clientX })
  $('photos').addEventListener('touchmove', (event) => {
    if (Math.abs(event.touches[0].clientX - startX) > 40) {
      show(1)
      startX = event.touches[0].clientX
    }
  })
  $('prev').addEventListener('click', () => show(-1))
  $('next').addEventListener('click', () => show(1))
</script>
</body>
</html>
