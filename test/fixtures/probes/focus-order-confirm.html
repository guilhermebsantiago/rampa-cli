<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialogs that Esc does not close</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 20px; }
  [hidden] { display: none !important; }
  .modal { position: fixed; top: 20%; left: 20%; width: 50%; background: #fff; border: 2px solid #000; padding: 16px; z-index: 10; }
</style>
</head>
<body>
<main>
  <h1>Your order</h1>
  <!-- Esc does nothing here. Every button answers the dialog: pressing one reports to /focus-order-confirm/, which the
       test server must never see. None of them is a way out, so the probe leaves the dialog open. -->
  <p><button id="open-renew" type="button" aria-haspopup="dialog" aria-controls="renew">Change the plan</button></p>
  <div id="renew" class="modal" role="dialog" aria-modal="true" aria-label="Change the plan" hidden>
    <p>Switch to the yearly plan?</p>
    <button type="button" data-answer="ok">OK</button>
    <button type="button" data-answer="confirm">Confirm</button>
    <button type="button" data-answer="done">Done</button>
    <button type="button" data-answer="cancel-order">Cancel my order</button>
  </div>
  <!-- Esc does nothing here either, but a button named only to close it does: Enter on it is the way out. -->
  <p><button id="open-notes" type="button" aria-haspopup="dialog" aria-controls="notes">Delivery notes</button></p>
  <div id="notes" class="modal" role="dialog" aria-modal="true" aria-label="Delivery notes" hidden>
    <p>Leave the parcel at the door.</p>
    <button type="button" data-answer="ok-notes">OK</button>
    <button type="button" id="notes-close" aria-label="Close dialog">×</button>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  for (const [button, dialog] of [['open-renew', 'renew'], ['open-notes', 'notes']]) {
    $(button).addEventListener('click', () => {
      $(dialog).hidden = false
      $(dialog).querySelector('button').focus()
    })
    // A modal that holds focus: Tab stays inside. Esc is ignored on purpose.
    $(dialog).addEventListener('keydown', (event) => {
      if (event.key !== 'Tab') return
      const buttons = Array.from($(dialog).querySelectorAll('button'))
      const at = buttons.indexOf(document.activeElement)
      event.preventDefault()
      buttons[(at + (event.shiftKey ? buttons.length - 1 : 1)) % buttons.length].focus()
    })
  }
  for (const answer of document.querySelectorAll('[data-answer]')) {
    answer.addEventListener('click', () => { new Image().src = '/focus-order-confirm/pressed?' + answer.dataset.answer })
  }
  $('notes-close').addEventListener('click', () => {
    $('notes').hidden = true
    $('open-notes').focus()
  })
</script>
</body>
</html>
