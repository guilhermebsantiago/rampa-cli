<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order: entries reused</title>
<style>
  body { font: 16px/1.4 Arial, sans-serif; margin: 24px; max-width: 640px; }
  label { display: block; margin-top: 8px; }
  fieldset { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Your order</h1>
  <form id="order" action="/order" method="post">
    <fieldset>
      <legend>Billing address</legend>
      <label for="b-street">Street</label>
      <input id="b-street" name="b-street" autocomplete="billing street-address">
    </fieldset>
    <label><input type="checkbox" id="same" checked> Shipping address is the same as my billing address</label>
    <fieldset id="shipping" hidden>
      <legend>Shipping address</legend>
      <label for="s-street">Street</label>
      <input id="s-street" name="s-street" autocomplete="shipping street-address">
    </fieldset>
    <button type="submit">Place order</button>
  </form>

  <h2>Receipts</h2>
  <form id="receipts" action="/receipts" method="post">
    <label for="contact">Contact e-mail</label>
    <input id="contact" name="contact" type="email" autocomplete="email">
    <label for="receipt">E-mail for receipts</label>
    <input id="receipt" name="receipt" type="email" autocomplete="email">
    <label for="gift-from">Name</label>
    <input id="gift-from" name="gift-from" autocomplete="name">
    <label for="invoice-name">Name</label>
    <input id="invoice-name" name="invoice-name" autocomplete="name" list="names">
    <datalist id="names"></datalist>
    <button type="submit">Save</button>
  </form>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  $('same').addEventListener('change', () => {
    $('shipping').hidden = $('same').checked
  })
  // The receipts address is filled in from the contact address.
  $('contact').addEventListener('change', () => {
    if ($('receipt').value === '') $('receipt').value = $('contact').value
  })
  // The second name is offered from the first.
  $('gift-from').addEventListener('change', () => {
    $('names').innerHTML = ''
    const option = document.createElement('option')
    option.value = $('gift-from').value
    $('names').append(option)
  })
</script>
</body>
</html>
