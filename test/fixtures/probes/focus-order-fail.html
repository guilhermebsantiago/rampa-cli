<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account: focus management failures</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 20px; }
  [hidden] { display: none !important; }
  .modal { position: fixed; top: 20%; left: 20%; width: 50%; background: #fff; border: 2px solid #000; padding: 16px; z-index: 10; }
  .menu { list-style: none; padding: 4px; margin: 0; border: 1px solid #888; background: #fff; }
  .form { display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
</style>
</head>
<body>
<!-- A modal placed before its trigger: it opens, focus stays on the trigger, and Tab from there never gets in. -->
<div id="terms" class="modal" role="dialog" aria-modal="true" aria-labelledby="terms-title" hidden>
  <h2 id="terms-title">Terms</h2>
  <p>Read the terms.</p>
  <button id="terms-close" type="button">Close</button>
</div>
<header><a href="#main" id="skip">Skip to content</a> <a href="/focus-order/home.html">Home</a></header>
<main id="main">
  <h1>Account</h1>
  <p><button id="open-terms" type="button" aria-haspopup="dialog" aria-controls="terms">Read the terms</button></p>
  <!-- A modal that takes focus but lets Tab out to the page behind, and leaves focus on the document when Esc closes it. -->
  <p><button id="open-help" type="button" aria-haspopup="dialog" aria-controls="help">Help</button></p>
  <div id="help" class="modal" role="dialog" aria-modal="true" aria-label="Help" hidden>
    <p>Call us.</p>
    <a href="/focus-order/contact.html" id="help-contact">Contact</a>
    <button id="help-close" type="button">Close</button>
  </div>
  <p><a href="/focus-order/orders.html" id="orders">Orders</a></p>
  <!-- A menu at the end of the page: Tab from its button passes most of the page before it. -->
  <p><button id="open-menu" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="actions">Actions</button></p>
  <p><a href="/focus-order/a.html">Addresses</a> <a href="/focus-order/b.html">Billing</a> <a href="/focus-order/c.html">Cards</a> <a href="/focus-order/d.html">Devices</a></p>
  <!-- A dialog that holds focus, and once closed sends it to the top of the page. -->
  <p><button id="open-prefs" type="button" aria-haspopup="dialog" aria-controls="prefs">Preferences</button></p>
  <!-- A form whose fields Tab visits out of their visual order. -->
  <form class="form" aria-label="Shipping address" id="shipping">
    <label style="order: 3">City <input id="city" name="city"></label>
    <label style="order: 1">Street <input id="street" name="street"></label>
    <label style="order: 4">Postal code <input id="zip" name="zip"></label>
    <label style="order: 2">Number <input id="number" name="number"></label>
  </form>
  <!-- A search field with a positive tabindex, far down the page. -->
  <footer><label>Search the help <input id="search" tabindex="1"></label></footer>
</main>
<div id="prefs" class="modal" role="dialog" aria-modal="true" aria-label="Preferences" hidden>
  <p>Choose a theme.</p>
  <button id="prefs-close" type="button">Close</button>
</div>
<ul id="actions" class="menu" role="menu" hidden>
  <li role="none"><a role="menuitem" href="/focus-order/export.html">Export</a></li>
  <li role="none"><a role="menuitem" href="/focus-order/print.html">Print</a></li>
</ul>
<script>
  const $ = (id) => document.getElementById(id)
  let open = null
  // Terms: opens without moving focus; Esc closes it and gives focus back to its button.
  $('open-terms').addEventListener('click', () => { $('terms').hidden = false; open = 'terms' })
  // Help: moves focus in, keeps nothing in, and Esc hides it without giving focus back.
  $('open-help').addEventListener('click', () => { $('help').hidden = false; open = 'help'; $('help-contact').focus() })
  // Actions: opens without moving focus; Esc closes it and gives focus back to its button.
  $('open-menu').addEventListener('click', () => { $('actions').hidden = false; $('open-menu').setAttribute('aria-expanded', 'true'); open = 'actions' })
  // Preferences: moves focus in and keeps it there; Esc closes it and sends focus to the top of the page.
  $('open-prefs').addEventListener('click', () => { $('prefs').hidden = false; open = 'prefs'; $('prefs-close').focus() })
  $('prefs').addEventListener('keydown', (event) => { if (event.key === 'Tab') { event.preventDefault(); $('prefs-close').focus() } })
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape' || !open) return
    const which = open
    open = null
    $(which).hidden = true
    if (which === 'terms') $('open-terms').focus()
    if (which === 'actions') { $('open-menu').setAttribute('aria-expanded', 'false'); $('open-menu').focus() }
    if (which === 'prefs') $('skip').focus()
  })
  for (const id of ['terms-close', 'help-close', 'prefs-close']) $(id).addEventListener('click', () => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' })))
</script>
</body>
</html>
