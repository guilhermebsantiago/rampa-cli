<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player: things that only move by dragging</title>
<style>
  body { font: 16px/1.4 Arial, sans-serif; margin: 24px; max-width: 720px; }
  .field { margin: 16px 0; }
  .track { position: relative; width: 300px; height: 8px; background: #ccc; margin: 16px 0; }
  .thumb { position: absolute; top: -8px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: #036; touch-action: none; }
  ul { list-style: none; padding: 0; width: 320px; }
  li { border: 1px solid #555; margin: 4px 0; padding: 8px; background: #fff; }
  .carousel { width: 320px; height: 120px; overflow: hidden; border: 1px solid #333; touch-action: pan-y; }
  .carousel figure { margin: 0; padding: 40px 16px; }
</style>
</head>
<body>
<main>
  <h1>Player</h1>
  <div class="field">
    <span id="vol-label">Volume</span>
    <div class="track" id="vol-track">
      <div id="vol" class="thumb" role="slider" tabindex="0" aria-labelledby="vol-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"></div>
    </div>
  </div>

  <h2>Tasks</h2>
  <!-- Sorted by native drag and drop; the Remove buttons are no alternative and are never pressed. -->
  <ul id="tasks">
    <li draggable="true">Write the report <button type="button">Remove</button></li>
    <li draggable="true">Call the bank <button type="button">Remove</button></li>
    <li draggable="true">Book the flight <button type="button">Remove</button></li>
  </ul>

  <h2>Queue</h2>
  <!-- Sorted with pointer events, as dnd-kit does. -->
  <ul id="queue">
    <li><div role="button" tabindex="0" aria-roledescription="sortable">Song A</div></li>
    <li><div role="button" tabindex="0" aria-roledescription="sortable">Song B</div></li>
    <li><div role="button" tabindex="0" aria-roledescription="sortable">Song C</div></li>
  </ul>

  <h2>Photos</h2>
  <div class="carousel" id="photos" role="region" aria-label="Photos">
    <figure>Photo 1 of 3: the harbour at dawn</figure>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  // The slider: dragged only; arrow keys move it, a click on its track does nothing.
  const vol = $('vol')
  const place = (value) => {
    const v = Math.round(Math.min(100, Math.max(0, value)))
    vol.setAttribute('aria-valuenow', String(v))
    vol.style.left = `${v * 3}px`
  }
  place(20)
  vol.addEventListener('pointerdown', (event) => {
    vol.setPointerCapture(event.pointerId)
    const move = (e) => place(((e.clientX - $('vol-track').getBoundingClientRect().left) / 300) * 100)
    const up = () => {
      vol.removeEventListener('pointermove', move)
      vol.removeEventListener('pointerup', up)
    }
    vol.addEventListener('pointermove', move)
    vol.addEventListener('pointerup', up)
  })
  vol.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight') place(Number(vol.getAttribute('aria-valuenow')) + 10)
    if (event.key === 'ArrowLeft') place(Number(vol.getAttribute('aria-valuenow')) - 10)
  })
  // Native drag and drop.
  let dragged = null
  for (const li of $('tasks').children) {
    li.addEventListener('dragstart', () => { dragged = li })
    li.addEventListener('dragover', (event) => event.preventDefault())
    li.addEventListener('drop', (event) => {
      event.preventDefault()
      if (!dragged || dragged === li) return
      const after = event.clientY > li.getBoundingClientRect().top + li.getBoundingClientRect().height / 2
      li.parentElement.insertBefore(dragged, after ? li.nextSibling : li)
    })
  }
  // Pointer events.
  for (const handle of $('queue').querySelectorAll('[role=button]')) {
    const li = handle.parentElement
    handle.addEventListener('pointerdown', (event) => {
      handle.setPointerCapture(event.pointerId)
      const startY = event.clientY
      const up = (e) => {
        handle.removeEventListener('pointerup', up)
        if (Math.abs(e.clientY - startY) < 5) return
        const others = [...$('queue').children].filter((other) => other !== li)
        const before = others.find((other) => e.clientY < other.getBoundingClientRect().top + other.getBoundingClientRect().height / 2)
        $('queue').insertBefore(li, before ?? null)
      }
      handle.addEventListener('pointerup', up)
    })
  }
  // The carousel: swiped only.
  let photo = 1
  let startX = 0
  $('photos').addEventListener('touchstart', (event) => { startX = event.touches[0].clientX })
  $('photos').addEventListener('touchmove', (event) => {
    if (Math.abs(event.touches[0].clientX - startX) > 40) {
      photo = (photo % 3) + 1
      $('photos').querySelector('figure').textContent = `Photo ${photo} of 3`
      startX = event.touches[0].clientX
    }
  })
</script>
</body>
</html>
